services:
  - type: web
    name: beu-syllabus-bot
    rootDir: .
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: RENDER_URL
        value: https://beu-syllabus-bot.onrender.com
      - key: WEB_PORT
        value: 10000
